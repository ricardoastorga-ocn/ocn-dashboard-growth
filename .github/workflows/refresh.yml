name: Refresh dashboard data

on:
  schedule:
    # 8am, 11am, 2pm, 5pm hora CDMX (UTC-6), lunes a viernes
    - cron: "0 14,17,20,23 * * 1-5"
    # 7pm hora CDMX = 1am UTC del día siguiente -> martes a sábado en UTC cubre lunes-viernes CDMX
    - cron: "0 1 * * 2-6"
  workflow_dispatch: {}

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refrescar datos desde Google Sheets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 refresh_data.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "ocn-dashboard-bot"
          git config user.email "actions@github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se hace commit."
          else
            git commit -m "Refresh datos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
